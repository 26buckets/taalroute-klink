<div id="klink-foto-tekst-menu" class="viz-dotted-background">
  <style>
    #klink-foto-tekst-menu { padding: 48px 8px 24px; }
    #klink-foto-tekst-menu .klink-demo { --k-paper:light-dark(#fff,#19272b); --k-canvas:light-dark(#ecf1ee,#101a1e); --k-ink:light-dark(#1a2425,#eaf0ed); --k-muted:light-dark(#65736f,#afbfba); --k-line:light-dark(#bdc9c6,#546662); --k-active:light-dark(#e3eef0,#2b4148); --k-primary:light-dark(#173f4b,#a6d3df); color:var(--k-ink); background:var(--k-canvas); font:400 18px/1.5 Arial,sans-serif; max-width:700px; margin:auto; padding:20px; }
    #klink-foto-tekst-menu .klink-demo * { box-sizing:border-box; }
    #klink-foto-tekst-menu .klink-title { font-size:22px; font-weight:500; margin:0 0 16px; }
    #klink-foto-tekst-menu .klink-exercise { background:var(--k-paper); }
    #klink-foto-tekst-menu .klink-prompt { margin:0; padding:16px; border-bottom:1px solid var(--k-line); }
    #klink-foto-tekst-menu .klink-stage { padding:8px 12px 20px; }
    #klink-foto-tekst-menu .klink-tools { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    #klink-foto-tekst-menu .klink-mini { display:flex; gap:2px; }
    #klink-foto-tekst-menu .klink-tool { display:grid; place-items:center; background:transparent; color:var(--k-ink); border:0; padding:6px; width:44px; height:44px; flex-shrink:0; }
    #klink-foto-tekst-menu .klink-tool > span { position:relative; display:grid; place-items:center; width:32px; height:32px; border:1px solid var(--k-line); background:var(--k-paper); border-radius:3px; }
    #klink-foto-tekst-menu .klink-tool[aria-pressed="true"] > span { background:var(--k-active); border-color:var(--k-primary); }
    #klink-foto-tekst-menu .klink-tool svg { width:18px; height:18px; stroke-width:1.7; }
    #klink-foto-tekst-menu .klink-tool[aria-pressed="false"] > span { color:var(--k-muted); }
    #klink-foto-tekst-menu .klink-text-button[aria-pressed="false"] > span::after { content:""; position:absolute; width:24px; height:1.5px; background:currentColor; transform:rotate(-45deg); }
    #klink-foto-tekst-menu .klink-photo-space { height:210px; display:grid; place-items:center; margin:12px 0 0; }
    #klink-foto-tekst-menu .klink-photo-space img { width:100%; height:210px; object-fit:contain; }
    #klink-foto-tekst-menu .klink-word-space { height:86px; display:grid; place-items:center; }
    #klink-foto-tekst-menu .klink-word { font-size:40px; font-weight:400; margin:0; }
    #klink-foto-tekst-menu [hidden] { display:none!important; }
    #klink-foto-tekst-menu .klink-a11y { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
    @media(max-width:420px) { #klink-foto-tekst-menu .klink-demo { padding:12px; } }
  </style>

  <script>
    (() => {
      const root=document.getElementById('klink-foto-tekst-menu');
      const demo=root.querySelector('.klink-demo');
      const saved=window.openai?.widgetState;
      const state={photo:typeof saved?.photo==='boolean'?saved.photo:true,text:typeof saved?.text==='boolean'?saved.text:true,view:saved?.view==='mobiel'?'mobiel':'desktop'};
      const photoButton=root.querySelector('.klink-photo-button'),textButton=root.querySelector('.klink-text-button'),listen=root.querySelector('.klink-listen'),audio=root.querySelector('audio');
      function render(){
        root.querySelector('#klink-demo-photo').hidden=!state.photo;
        root.querySelector('#klink-demo-word').hidden=!state.text;
        demo.style.maxWidth=state.view==='mobiel'?'390px':'700px';
        for(const [button,key,label] of [[photoButton,'photo','Foto'],[textButton,'text','Tekst']]){
          button.setAttribute('aria-pressed',String(state[key]));
          const action=label+' '+(state[key]?'verbergen':'tonen');
          button.setAttribute('aria-label',action);button.setAttribute('data-tooltip',action);
        }
        photoButton.querySelector('span').innerHTML='<i data-lucide="'+(state.photo?'image':'image-off')+'" aria-hidden="true"></i>';
        if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});
      }
      function save(){window.openai?.setWidgetState({modelContent:{voorstel:'Vast mini-menu voor foto en tekst in het speelvlak',...state}})?.catch(()=>{});}
      for(const [button,key] of [[photoButton,'photo'],[textButton,'text']])button.addEventListener('click',()=>{state[key]=!state[key];render();root.querySelector('[aria-live]').textContent='Foto '+(state.photo?'zichtbaar':'verborgen')+'. Tekst '+(state.text?'zichtbaar':'verborgen')+'.';save();});
      listen.addEventListener('click',()=>{audio.currentTime=0;audio.play().catch(()=>{root.querySelector('[aria-live]').textContent='Het geluid kan hier niet worden afgespeeld.';});});
      audio.addEventListener('playing',()=>listen.setAttribute('aria-label','Opnieuw luisteren'));
      window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState;if(!next)return;for(const key of ['photo','text'])if(typeof next[key]==='boolean')state[key]=next[key];if(['desktop','mobiel'].includes(next.view))state.view=next.view;render();});
      render();
      if(globalThis.Tweak){const tweak=new Tweak({container:demo,onChange:()=>{render();save();}});tweak.addSelect(state,'view',{label:'Scherm',options:[{label:'Desktop',value:'desktop'},{label:'Mobiel',value:'mobiel'}]});}
    })();
  </script>
